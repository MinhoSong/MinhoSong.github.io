name: Replace site with redesigned package

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/replace-site.yml
      - .github/workflows/site-package.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replace-static-site
  cancel-in-progress: false

jobs:
  replace-site:
    if: github.repository == 'MinhoSong/MinhoSong.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_WORKSPACE:-}" || "$PWD" != "$GITHUB_WORKSPACE" || ! -d .git ]]; then
            echo "Refusing to modify an unexpected directory." >&2
            exit 1
          fi

          package="$GITHUB_WORKSPACE/.github/workflows/site-package.zip"
          extract_dir="$(mktemp -d)"
          cp "$package" /tmp/site-package.zip
          unzip -q /tmp/site-package.zip -d "$extract_dir"
          source_dir="$extract_dir/MinhoSong.github.io-redesign"
          test -f "$source_dir/index.html"
          test -f "$source_dir/ai/fk-edge-heap-lab.html"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$source_dir"/. "$GITHUB_WORKSPACE"/

          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            '.nojekyll' \
            '404.html' \
            'CV_Minho Song.pdf' \
            'README.md' \
            'ai-math.html' \
            'ai/fk-edge-heap-lab.html' \
            'assets/css/site.css' \
            'assets/fonts/LICENSE-Newsreader.txt' \
            'assets/fonts/newsreader-latin-400-italic.woff2' \
            'assets/fonts/newsreader-latin-400-normal.woff2' \
            'assets/fonts/newsreader-latin-600-italic.woff2' \
            'assets/fonts/newsreader-latin-600-normal.woff2' \
            'assets/img/profile-pic.jpg' \
            'favicon.ico' \
            'index.html' \
            'papers.html' | sort > "$expected"
          find . -path './.git' -prune -o -type f -printf '%P\n' | sort > "$actual"
          diff -u "$expected" "$actual"

      - name: Commit exact site tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Minho Song"
          git config user.email "25495174+MinhoSong@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace site with redesigned static homepage"
          git push origin HEAD:master
